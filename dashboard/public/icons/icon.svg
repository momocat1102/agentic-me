<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#7c4dff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.3"/>
  <!-- CC letters -->
  <text x="256" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="180" fill="url(#accent)">CC</text>
  <!-- Pulse dots -->
  <circle cx="256" cy="400" r="8" fill="#4fc3f7"/>
  <circle cx="220" cy="400" r="5" fill="#4fc3f7" opacity="0.5"/>
  <circle cx="292" cy="400" r="5" fill="#4fc3f7" opacity="0.5"/>
</svg>
